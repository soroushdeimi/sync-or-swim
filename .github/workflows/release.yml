---
name: release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and save image
        run: |
          make image-save
          (cd dist && sha256sum node-image.tar.gz > node-image.tar.gz.sha256)
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/node-image.tar.gz
            dist/node-image.tar.gz.sha256
          generate_release_notes: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image to GHCR
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ghcr_repo="ghcr.io/${owner}/sync-or-swim-node"
          local_ref=$(scripts/image.sh tag)
          content_hash="${local_ref##*:}"
          tag="${{ github.ref_name }}"

          docker tag "$local_ref" "${ghcr_repo}:${tag}"
          docker tag "$local_ref" "${ghcr_repo}:${content_hash}"
          docker push "${ghcr_repo}:${tag}"
          docker push "${ghcr_repo}:${content_hash}"
