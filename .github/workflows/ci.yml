---
name: ci

"on":
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make deps
      - run: make lint

  lab:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo modprobe wireguard
      - run: make deps
      - run: make up
      - name: Idempotency (second run must report changed=0)
        run: .venv/bin/ansible-playbook playbooks/site.yml | tee run2.log && grep -q 'changed=0' run2.log
      - run: make test
      - if: always()
        run: docker compose -p sync-or-swim logs --no-color
