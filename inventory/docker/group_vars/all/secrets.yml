---
# Generated on first use into build/secrets (git-ignored) and never committed.
lab_secrets_dir: "{{ lab_build_dir }}/secrets"
mysql_root_password: >-
  {{ lookup('ansible.builtin.password', lab_secrets_dir ~ '/mysql_root', length=24, chars=['ascii_letters', 'digits']) }}
mysql_repl_password: >-
  {{ lookup('ansible.builtin.password', lab_secrets_dir ~ '/mysql_repl', length=24, chars=['ascii_letters', 'digits']) }}
mysql_exporter_password: >-
  {{ lookup('ansible.builtin.password', lab_secrets_dir ~ '/mysql_exporter', length=24, chars=['ascii_letters', 'digits']) }}
bgp_password: "{{ lookup('ansible.builtin.password', lab_secrets_dir ~ '/bgp', length=16, chars=['ascii_letters', 'digits']) }}"
grafana_admin_password: >-
  {{ lookup('ansible.builtin.password', lab_secrets_dir ~ '/grafana_admin', length=24, chars=['ascii_letters', 'digits']) }}
