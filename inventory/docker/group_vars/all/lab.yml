---
lab_project: sync-or-swim

lab_root: "{{ (playbook_dir ~ '/..') | realpath }}"
lab_build_dir: "{{ lab_root }}/build"
# run/<host>/{frr,textfile}, shared with exporter sidecars
lab_run_dir: "{{ lab_build_dir }}/run"
sidecar_healer_image: docker:28.5.1-cli
lab_mgmt_network: "{{ lab_project }}_mgmt"

# Tagged by content hash: rebuilds only when the build context changes.
node_image_context: "{{ lab_root }}/docker/node"
node_image: >-
  {{ lab_project }}/node:{{ (lookup('file', node_image_context ~ '/Dockerfile')
      ~ lookup('file', node_image_context ~ '/entrypoint.sh')
      ~ lookup('file', node_image_context ~ '/sos-apply')) | hash('sha1') | truncate(12, True, '') }}

# transit-a/b are the two independent paths; mgmt never carries replication.
lab_networks:
  transit-a:
    subnet: 172.31.1.0/24
    internal: true
    ifname: ul-a
  transit-b:
    subnet: 172.31.2.0/24
    internal: true
    ifname: ul-b
  mgmt:
    subnet: 172.31.100.0/24
    internal: false
    ifname: mgmt0

# /proc/sys is read-only in containers, so Docker sets these.
lab_sysctls:
  net.ipv4.ip_forward: 1
  net.ipv4.conf.all.rp_filter: 2
  net.ipv4.conf.default.rp_filter: 2
  net.ipv4.fib_multipath_hash_policy: 1

ansible_managed: Managed by Ansible (sync-or-swim); local edits will be overwritten.

mgmt_services:
  prometheus: 172.31.100.30
  alertmanager: 172.31.100.31
  grafana: 172.31.100.32
  loki: 172.31.100.33
  alloy: 172.31.100.34
  mailpit: 172.31.100.35
  alert-webhook: 172.31.100.36

# Sidecars in each node's netns, listening on its mgmt IP.
exporter_ports:
  node: 9100
  blackbox: 9115
  frr: 9342
  wireguard: 9586
  mysqld: 9104
