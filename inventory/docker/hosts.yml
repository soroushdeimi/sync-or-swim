---
# Docker lab inventory. Each data-plane host is a container with the same name.
# Moving to VMs means a new inventory (SSH connection); the roles stay the same.
all:
  children:
    lab:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    nodes:
      vars:
        ansible_connection: community.docker.docker
      children:
        mysql:
          hosts:
            mysql-1:
            mysql-2:
        relays:
          hosts:
            wg-1:
            wg-2:
