---
- name: Tear the lab down
  hosts: lab
  gather_facts: false
  tasks:
    - name: Remove containers and networks
      community.docker.docker_compose_v2:
        project_src: "{{ lab_build_dir }}"
        project_name: "{{ lab_project }}"
        state: absent
        remove_orphans: true
      when: (lab_build_dir ~ '/compose.yml') is file
