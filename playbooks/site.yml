---
- name: Lab infrastructure (images, networks, containers)
  hosts: lab
  gather_facts: false
  roles:
    - lab_infra

- name: WireGuard tunnels
  ansible.builtin.import_playbook: wireguard.yml
- name: Routing (FRR, BGP, BFD)
  ansible.builtin.import_playbook: frr.yml
- name: MySQL primary/replica
  ansible.builtin.import_playbook: mysql.yml
- name: Exporters
  ansible.builtin.import_playbook: exporters.yml
- name: Monitoring and alerting
  ansible.builtin.import_playbook: monitoring.yml
- name: Central logging
  ansible.builtin.import_playbook: logging.yml
