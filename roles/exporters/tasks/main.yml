---
- name: Create exporters build directory
  ansible.builtin.file:
    path: "{{ lab_build_dir }}/exporters"
    state: directory
    mode: "0755"

- name: Ensure textfile directories exist
  ansible.builtin.file:
    path: "{{ lab_run_dir }}/{{ item }}/textfile"
    state: directory
    mode: "0755"
  loop: "{{ groups['nodes'] }}"

- name: Render active-path script
  ansible.builtin.template:
    src: active-path.sh.j2
    dest: "{{ lab_build_dir }}/exporters/active-path.sh"
    mode: "0755"

- name: Render per-node blackbox configuration
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ lab_build_dir }}/exporters/blackbox-{{ item }}.yml"
    mode: "0644"
  loop: "{{ groups['mysql'] }}"

- name: Render exporters compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ lab_build_dir }}/exporters/compose.yml"
    mode: "0644"

- name: Query lab node container IDs
  ansible.builtin.command:
    cmd: "docker inspect --format {% raw %}'{{.Id}}'{% endraw %} {{ item }}"
  loop: "{{ groups['nodes'] }}"
  register: exporters_node_inspect
  changed_when: false

- name: Check exporter container network namespaces
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      docker ps -aq --filter label=com.docker.compose.project={{ lab_project }}-exporters |
      xargs -r docker inspect --format {% raw %}'{{index .Config.Labels "sos.node"}} {{.HostConfig.NetworkMode}}'{% endraw %}
    executable: /bin/bash
  register: exporters_sidecars_inspect
  changed_when: false

- name: Determine if exporter containers need recreate
  ansible.builtin.set_fact:
    exporters_need_recreate: "{{ (mismatches | from_json | length) > 0 }}"
  vars:
    node_ids: "{{ exporters_node_inspect.results | items2dict(key_name='item', value_name='stdout') }}"
    mismatches: >-
      [
      {% for line in exporters_sidecars_inspect.stdout_lines if line.split() | length == 2 %}
      {%   set parts = line.split() %}
      {%   if parts[0] in node_ids and parts[1] != ('container:' ~ node_ids[parts[0]]) %}
      "{{ parts[0] }}",
      {%   endif %}
      {% endfor %}
      ]

- name: Remove stale exporter containers if parent node was recreated
  community.docker.docker_compose_v2:
    project_src: "{{ lab_build_dir }}/exporters"
    project_name: "{{ lab_project }}-exporters"
    state: absent
  when: exporters_need_recreate | bool

- name: Bring up exporter containers
  community.docker.docker_compose_v2:
    project_src: "{{ lab_build_dir }}/exporters"
    project_name: "{{ lab_project }}-exporters"
    state: present
    remove_orphans: true
    wait: true
