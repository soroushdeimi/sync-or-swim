---
- name: Create FRR configuration directory
  ansible.builtin.file:
    path: "{{ frr_config_dir }}"
    state: directory
    mode: "0755"

- name: Render FRR daemons configuration
  ansible.builtin.template:
    src: daemons.j2
    dest: "{{ frr_config_dir }}/daemons"
    mode: "0644"
  notify: Apply FRR configuration

- name: Render FRR main configuration
  ansible.builtin.template:
    src: frr.conf.j2
    dest: "{{ frr_config_dir }}/frr.conf"
    mode: "0640"
  # holds the BGP password
  diff: false
  notify: Apply FRR configuration

- name: Render FRR init script
  ansible.builtin.template:
    src: 20-frr.sh.j2
    dest: "{{ frr_init_dir }}/20-frr.sh"
    mode: "0755"
  notify: Apply FRR configuration

- name: Apply pending FRR changes now
  ansible.builtin.meta: flush_handlers

# delayopen holds the session to the primary relay back on purpose, so a
# finished deploy waits until every session is up instead of racing it
- name: Wait for all BGP sessions to be established
  # vtysh errors while bgpd restarts; treat that as "no sessions yet"
  ansible.builtin.shell:
    cmd: vtysh -c 'show ip bgp summary json' 2>/dev/null || echo '{}'
  register: frr_bgp_summary
  changed_when: false
  until: >-
    (frr_bgp_summary.stdout | from_json).get('ipv4Unicast', {}).get('peers', {}) | dict2items | length > 0 and
    (frr_bgp_summary.stdout | from_json).ipv4Unicast.peers | dict2items
    | rejectattr('value.state', 'equalto', 'Established') | list | length == 0
  retries: 40
  delay: 3
